name: App DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '25'

jobs:
  build-and-quality:
    name: Build & Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven Build & Unit Tests
        run: ./mvnw clean package -DskipTests

      - name: Checkstyle (non-blocking)
        continue-on-error: true
        run: ./mvnw checkstyle:check

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webgoat-jar
          path: target/webgoat-*.jar

  sast:
    name: SAST - SonarCloud
    needs: build-and-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw clean package -DskipTests org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey="${{ vars.SONAR_PROJECT_KEY }}" \
            -Dsonar.organization="${{ vars.SONAR_ORGANIZATION }}" \
            -Dsonar.host.url="https://sonarcloud.io"

  sca-scan:
    name: SCA - Dependency Scan
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Resolve Maven Dependencies Locally
        run: ./mvnw dependency:resolve -DskipTests

      - name: Run Trivy FS Scan (Dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  docker-build-and-scan:
    name: Docker Build & Security Scan
    needs: sca-scan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: webgoat-jar
          path: target/

      - name: Build Docker Image
        run: docker build -t webgoat:${{ github.sha }} .

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'webgoat:${{ github.sha }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981207388642:role/github-actions-ecr-push
          aws-region: us-east-1

      - name: Login to ECR
        run: aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REPO_URL }}

      - name: Tag and push to ECR
        run: |
          docker tag webgoat:${{ github.sha }} ${{ secrets.ECR_REPO_URL }}:${{ github.sha }}
          docker push ${{ secrets.ECR_REPO_URL }}:${{ github.sha }}  
  
  update-helm-repo:
    name: Update Helm Repo Image Tag
    needs: docker-build-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helm-repo
        uses: actions/checkout@v4
        with:
          repository: lukaradenkovic2003/webgoat-helm
          token: ${{ secrets.HELM_REPO_TOKEN }}
          path: webgoat-helm

      - name: Update image tag in values.yaml
        run: |
          cd webgoat-helm
          sed -i "s/tag: .*/tag: \"${{ github.sha }}\"/" values.yaml
          cat values.yaml

      - name: Commit and push tag update
        run: |
          cd webgoat-helm
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add values.yaml
          git commit -m "chore: update image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push        
            